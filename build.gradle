plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = mod_version
group = 'com.chunkworks.backpacksplus'
base { archivesName = 'backpacksplus' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }

// Domain rules will remain JDK-only; game adapters live in main.
sourceSets { domain; gametest }
var prepareGameTests = tasks.register('prepareGameTests', Copy) {
    from 'devtools/gameteststructures'
    into 'run/gametest/gameteststructures'
}
neoForge {
    version = project.neo_version
    // Official Mojang mappings, matching the current project modpack.
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'backpacksplus'
            taskBefore prepareGameTests
        }
        networkServer {
            server(); sourceSet=sourceSets.gametest
            gameDirectory=file(providers.gradleProperty('testServerDir').getOrElse('run/network-server'))
            programArgument '--nogui'
        }
        networkDriver {
            client(); sourceSet=sourceSets.gametest
            gameDirectory=file(providers.gradleProperty('testDriverDir').getOrElse('run/network-driver'))
            programArgument '--username'; programArgument 'QuickDriver'
            systemProperty 'backpacksplus.testRole','driver'
        }
        networkObserver {
            client(); sourceSet=sourceSets.gametest
            gameDirectory=file(providers.gradleProperty('testObserverDir').getOrElse('run/network-observer'))
            programArgument '--username'; programArgument 'QuickViewer'
            systemProperty 'backpacksplus.testRole','observer'
        }
        matching { it.name.startsWith('network') }.configureEach {
            systemProperty 'backpacksplus.networkTest','true'
            systemProperty 'backpacksplus.testDir',file('run/network-control').absolutePath
            systemProperty 'backpacksplus.testPort','25586'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        backpacksplus { sourceSet(sourceSets.main); sourceSet(sourceSets.domain) }
        backpacksplus_gametest { sourceSet(sourceSets.gametest) }
    }
    addModdingDependenciesTo(sourceSets.gametest)
}
neoForge.runs.matching { it.name != 'gameTestServer' && !it.name.startsWith('network') }.configureEach {
    loadedMods = neoForge.mods.matching { it.name != 'backpacksplus_gametest' }
}
dependencies {
    // Unreleased companion built in the adjacent workspace; never bundled into this jar.
    compileOnly files('../minecraft-quickslot/build/libs/quickslot-0.1.0.jar')
    implementation sourceSets.domain.output
    gametestImplementation sourceSets.main.output
    gametestImplementation sourceSets.domain.output
    gametestImplementation files('../minecraft-quickslot/build/libs/quickslot-0.1.0.jar')
    testImplementation sourceSets.domain.output
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
}
test { useJUnitPlatform() }
jar { from sourceSets.domain.output }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def releaseVersion = project.version.toString()
processResources {
    inputs.property 'version', releaseVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: releaseVersion }
}
def gameTestLog = layout.projectDirectory.file('run/gametest/logs/latest.log').asFile
tasks.named('runGameTestServer') {
    doLast {
        def log = gameTestLog.text
        def passed = log =~ /All (\d+) required tests passed/
        if (!passed.find()) throw new GradleException('No passing GameTest completion marker')
        logger.lifecycle("backpacksplus: all ${passed.group(1)} required GameTests passed")
    }
}
check { dependsOn 'runGameTestServer' }
